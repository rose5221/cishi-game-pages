    <style>html,body{background:#080807;min-height:100%;margin:0}body{overflow:hidden}#cishi-boot{color:#e8dfcc;background:radial-gradient(circle at 50% 43%,#c9a86517,#0000 26rem),#080807;place-items:center;font-family:Songti SC,STSong,serif;display:grid;position:fixed;inset:0;overflow:hidden}#cishi-boot:before{content:"";opacity:.2;pointer-events:none;background-image:repeating-linear-gradient(0deg,#0000 0 3px,#ffffff05 3px 4px);position:absolute;inset:0}.cishi-boot-card{text-align:center;justify-items:center;gap:16px;padding:28px;display:grid;position:relative}.cishi-boot-seal{color:#c9a865;border:1px solid #c9a8659e;place-items:center;width:58px;height:58px;font-size:30px;line-height:1;animation:2.8s ease-in-out infinite cishi-breathe;display:grid;box-shadow:inset 0 0 24px #c9a86512,0 0 42px #c9a8650d}.cishi-boot-title{letter-spacing:.28em;text-indent:.28em;margin:4px 0 0;font-size:25px;font-weight:400}.cishi-boot-subtitle{color:#e8dfcc7a;letter-spacing:.12em;margin:0;font-size:11px}.cishi-boot-progress{background:#c9a86529;width:136px;height:1px;margin-top:3px;overflow:hidden}.cishi-boot-progress:after{content:"";background:linear-gradient(90deg,#0000,#c9a865,#0000);width:44%;height:100%;animation:1.65s ease-in-out infinite cishi-loading;display:block}#cishi-boot-retry,#cishi-boot-backup{color:#c9a865;font:inherit;cursor:pointer;background:#c9a86514;border:1px solid #c9a8657a;border-radius:2px;margin-top:7px;padding:9px 18px;font-size:12px;display:none}#cishi-boot.slow .cishi-boot-subtitle{color:#e8dfccad}#cishi-boot.slow #cishi-boot-retry,#cishi-boot.slow #cishi-boot-backup{display:inline-flex}#cishi-boot-backup{color:#e8dfcc9e;border:1px solid #e8dfcc29;border-radius:2px;justify-content:center;align-items:center;margin-top:7px;padding:8px 16px;font-size:11px;text-decoration:none}@keyframes cishi-loading{0%{transform:translate(-110%)}to{transform:translate(330%)}}@keyframes cishi-breathe{0%,to{opacity:.72;transform:scale(.98)}50%{opacity:1;transform:scale(1.03)}}@media (prefers-reduced-motion:reduce){.cishi-boot-seal,.cishi-boot-progress:after{animation:none}}</style>

  <body>
    <div id="root">
      <div id="cishi-boot" role="status" aria-live="polite">
        <div class="cishi-boot-card">
          <div class="cishi-boot-seal" aria-hidden="true">此</div>
          <h1 class="cishi-boot-title">此世</h1>
          <p class="cishi-boot-subtitle">正在点亮此世，初次载入可能需要片刻</p>
          <div class="cishi-boot-progress" aria-hidden="true"></div>
          <button id="cishi-boot-retry" type="button" onclick="window.__cishiForceReload && window.__cishiForceReload()">重新载入</button>
          <a id="cishi-boot-backup" href="https://cishi-game.onrender.com/" rel="noreferrer">换备用入口</a>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var retryKey = 'cishi.boot.autoRetryAt';
        var retryTimer = null;

        function bootShell() {
          return document.getElementById('cishi-boot');
        }

        function markSlow(message) {
          var boot = bootShell();
          if (!boot) return;
          boot.classList.add('slow');
          var text = boot.querySelector('.cishi-boot-subtitle');
          if (text) text.textContent = message;
        }

        var backup = document.getElementById('cishi-boot-backup');
        if (backup) {
          var onRender = window.location.hostname.endsWith('onrender.com');
          backup.href = onRender
            ? 'https://rose5221.github.io/cishi-game-pages/'
            : 'https://cishi-game.onrender.com/';
        }

        window.__cishiForceReload = function () {
          var url = new URL(window.location.href);
          url.searchParams.set('fresh', String(Date.now()));
          window.location.replace(url.toString());
        };

        function autoRecover() {
          if (!bootShell()) return;
          var last = Number(window.sessionStorage.getItem(retryKey) || 0);
          if (Date.now() - last < 45000) {
            markSlow('仍没有收到这一卷。请点下方重新载入，或稍后再来。');
            return;
          }
          try { window.sessionStorage.setItem(retryKey, String(Date.now())); } catch (_) {}
          markSlow('有一页没有送到，正在换一条路重新翻开。');
          window.setTimeout(window.__cishiForceReload, 900);
        }

        window.__cishiBootTimer = window.setTimeout(function () {
          if (!bootShell()) return;
          markSlow('仍在醒来。网络较慢时，可以重新载入一次');
        }, 18000);

        // One automatic cache-busting retry. This recovers stale HTML that still
        // points at an asset version removed by a later deployment.
        retryTimer = window.setTimeout(function () {
          if (!bootShell()) return;
          autoRecover();
        }, 24000);

        window.addEventListener('error', function (event) {
          var target = event.target;
          if (!target || (target.tagName !== 'SCRIPT' && target.tagName !== 'LINK')) return;
          markSlow('这一页没有完整送到，正在重新联络。');
          if (retryTimer) window.clearTimeout(retryTimer);
          retryTimer = window.setTimeout(autoRecover, 1800);
        }, true);
      })();
    </script>
    <noscript><p style="color:#e8dfcc;text-align:center;padding:2rem">请开启 JavaScript 后进入此世。</p></noscript>
